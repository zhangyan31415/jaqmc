schema_version = "moirekp-physical-v1"
model_name = "model_spin_up_projected"
energy_unit = "eV"
momentum_unit = "1/angstrom"

[polynomial]
complex_coordinate = "z_Q=(kx-Qx)+i*(ky-Qy)"
maximum_order = 10

[q_lattice]
b1 = [0.3797501810370922, -9.71445146547012e-17]
b2 = [0.18987509051854617, 0.3288733038698614]
offset_gauge = "explicit_sector_offsets_v1"

[[sectors]]
id = "L1"
qset = "qset1"
q_offset = [0.18987509051854617, 0.10962443462328712]
number_of_orbitals = 1

[[sectors]]
id = "L2"
qset = "qset2"
q_offset = [4.8402306511217816e-17, 0.21924886924657433]
number_of_orbitals = 1

[validation]
lattice_tolerance = 1e-08

[runtime]
canonical_evaluator = "equation_17_integer_routes"
terms_file = "terms.csv"
default_q_points_file = "q_points.csv"
